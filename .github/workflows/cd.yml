name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build all services
        run: |
          mvn clean package -DskipTests -f user-service/pom.xml
          mvn clean package -DskipTests -f hotel-service/pom.xml
          mvn clean package -DskipTests -f booking-service/pom.xml
          mvn clean package -DskipTests -f notification-service/pom.xml
          mvn clean package -DskipTests -f api-gateway/pom.xml

      - name: Docker build and tag all services
        run: |
          docker build -t user-service:latest -f user-service/Dockerfile .
          docker build -t hotel-service:latest -f hotel-service/Dockerfile .
          docker build -t booking-service:latest -f booking-service/Dockerfile .
          docker build -t notification-service:latest -f notification-service/Dockerfile .
          docker build -t api-gateway:latest -f api-gateway/Dockerfile .

      - name: Post-deploy health check
        run: |
          echo "Build and deployment artifacts created successfully"
          echo "Services built: user-service, hotel-service, booking-service, notification-service, api-gateway"
          docker images | grep -E "user-service|hotel-service|booking-service|notification-service|api-gateway"